[package]
name = "aun-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
snow = "0.9"
spake2 = "0.4"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"
arboard = { version = "3.6", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
