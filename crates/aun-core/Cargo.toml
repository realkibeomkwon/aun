[package]
name = "aun-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
snow = "0.9"
spake2 = "0.4"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
# Clipboard images travel as PNG; the version Rune already builds.
png = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[dev-dependencies]
# Snow's own ChaCha20-Poly1305, for a known-answer test of this machine's backend.
chacha20poly1305 = "0.10"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
