name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml (1.99.1 with clippy) on the first cargo call.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # A fixed self-signed identity keeps macOS privacy grants across builds; without the secret (forks) the app is ad-hoc signed.
      - name: import signing identity (macOS)
        if: runner.os == 'macOS'
        env:
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_P12_PASSWORD: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$MAC_SIGN_P12" ]; then echo "no MAC_SIGN_P12 secret: ad-hoc signing"; exit 0; fi
          kc="$RUNNER_TEMP/sign.keychain-db"
          kcpw=$(uuidgen)
          echo "$MAC_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/sign.p12" -k "$kc" -P "$MAC_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/sign.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id=$(security find-identity -p codesigning "$kc" | awk '/ 1\) / {print $2; exit}')
          test -n "$id"
          echo "MAC_SIGN_IDENTITY=$id" >> "$GITHUB_ENV"
      - name: build (macOS app)
        if: runner.os == 'macOS'
        run: |
          scripts/bundle-mac.sh
          codesign -d -r- target/release/Aun.app
      - name: build (Windows exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release -p aun
          $v = (Get-Item target/release/aun.exe).VersionInfo
          "$($v.ProductName) $($v.FileVersion)"
          if ($v.ProductName -ne 'Aun') { throw 'no version resource' }
          if (Select-String -Path target/release/aun.exe -Pattern 'VCRUNTIME140' -SimpleMatch -Quiet) { throw 'links the VC++ runtime dynamically' }
      - name: throughput (release, loopback)
        run: cargo test --release -p aun-core --test link -- --ignored --nocapture throughput
      - name: cipher speed (release, in memory)
        run: cargo test --release -p aun-core --lib -- --ignored --nocapture seal_open_speed
      - uses: actions/upload-artifact@v4
        with:
          name: aun-${{ matrix.os }}
          path: |
            target/release/Aun-mac.zip
            target/release/aun.exe
          if-no-files-found: error
