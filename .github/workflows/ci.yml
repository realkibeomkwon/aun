name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml (1.99.1 with clippy) on the first cargo call.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p aun
      - name: throughput (release, loopback)
        run: cargo test --release -p aun-core --test link -- --ignored --nocapture throughput
      - uses: actions/upload-artifact@v4
        with:
          name: aun-${{ matrix.os }}
          path: |
            target/release/aun
            target/release/aun.exe
          if-no-files-found: ignore
