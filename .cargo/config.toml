# Apple Silicon: RustCrypto's ChaCha20 uses NEON only with `chacha20_force_neon` (x86 picks AVX2
# at run time). It seals the link about 25% faster on an M4 Pro. The AES flags do the same for
# AES-GCM, which isn't on the wire but is measured by `seal_open_speed`. A build with RUSTFLAGS
# set in the environment skips this file's rustflags, so add the flags there too.
[target.aarch64-apple-darwin]
rustflags = ["--cfg", "chacha20_force_neon", "--cfg", "aes_armv8", "--cfg", "polyval_armv8"]
